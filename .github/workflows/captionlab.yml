name: CaptionLab CPU diagnostics

on:
  push:
    paths:
      - 'captionlab/**'
      - 'tests/test_captionlab_*.py'
      - '.github/workflows/captionlab.yml'
  pull_request:
    paths:
      - 'captionlab/**'
      - 'tests/test_captionlab_*.py'
      - '.github/workflows/captionlab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r captionlab/requirements-cpu.txt
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -c captionlab/pytest.ini -q
      - run: python -m captionlab --help
